    <div id="zoom"><button class="btn" id="zi" aria-label="Acercar">+</button><button class="btn" id="zo" aria-label="Alejar">−</button><button class="btn" id="zf" aria-label="Centrar en mí">◎</button><button class="btn" id="zmax" aria-label="Plano grande">⤢</button></div>

<script>
function boot(P){const DECKS=P.DECKS,G=P.G,EQ=P.EQ||[],CAPN=P.CAPN||{},CODES=P.CODES||{},META=P.META;
// Navigation engine (shared by test and page)
const ENG=(function(){
const DECKNAME={doublebottom:'Doble fondo (marrón)',toptanks:'Plataformas (naranja)',second:'Segunda cubierta (amarilla)',main:'Cubierta principal (verde)',level01:'Nivel 01 (celeste)',level02:'Nivel 02 (azul)',level03:'Nivel 03 (lila)'};
const LVL={doublebottom:0,toptanks:1,second:2,main:3,level01:4,level02:5,level03:6};
const HEAD=['proa','estribor','popa','babor'];
const sideOf=dy=>dy<-35?'babor':dy>35?'estribor':'crujía';
function build(G){const adj=G.nodes.map(()=>[]);G.edges.forEach(([a,b,c,t])=>{adj[a].push([b,c,t]);adj[b].push([a,c,t])});G.adj=adj;return G}
function path(G,s,t){const n=G.nodes.length,d=new Array(n).fill(Infinity),p=new Array(n).fill(-1),pt=new Array(n).fill(null),done=new Uint8Array(n);d[s]=0;
  for(;;){let u=-1,m=Infinity;for(let i=0;i<n;i++)if(!done[i]&&d[i]<m){m=d[i];u=i}if(u<0||u===t)break;done[u]=1;
    for(const[v,c,ty]of G.adj[u]){if(d[u]+c<d[v]){d[v]=d[u]+c;p[v]=u;pt[v]=ty}}}
  if(d[t]===Infinity)return null;const P=[];for(let v=t;v!==-1;v=p[v])P.unshift({n:v,via:pt[v]});return P}
function heading(A,B){const dx=(B.fr-A.fr)*0.67,dy=(B.dy-A.dy)*0.0529;if(Math.abs(dx)>=Math.abs(dy))return dx>=0?0:2;return dy>=0?1:3}
function turn(from,to){const k=((to-from)%4+4)%4;return k===0?null:k===1?'derecha':k===3?'izquierda':'atrás'}
// Build steps: list of {kind,text,head,deck,pts:[nodeIds],dist}
function steps(G,P,dest){const N=G.nodes;const S=[];let cur=null;
  for(let i=1;i<P.length;i++){const a=N[P[i-1].n],b=N[P[i].n];
    if(P[i].via==='v'){if(cur){S.push(cur);cur=null}
      const up=LVL[b.d]>LVL[a.d];S.push({kind:'lad',up,from:a.d,to:b.d,fr:a.fr,dy:a.dy,virt:!!a.virt,pts:[P[i-1].n,P[i].n],deck:a.d});continue}
    const dist=Math.hypot((b.fr-a.fr)*0.67,(b.dy-a.dy)*0.0529);if(dist<0.3)continue;
    const h=heading(a,b);
    if(cur&&cur.head===h&&cur.deck===a.d){cur.dist+=dist;cur.pts.push(P[i].n);cur.toFr=b.fr;cur.toDy=b.dy;cur.door=(P[i].via==='door'&&i===P.length-1)}
    else{if(cur)S.push(cur);cur={kind:'walk',head:h,deck:a.d,dist,pts:[P[i-1].n,P[i].n],fromFr:a.fr,toFr:b.fr,toDy:b.dy,door:(P[i].via==='door'&&i===P.length-1),exit:(i===1&&P[1].via==='door')}}}
  if(cur)S.push(cur);
  // merge tiny walks (<1.5 m) into neighbours
  const T=[];for(const s of S){if(s.kind==='walk'&&s.dist<1.5&&T.length&&T[T.length-1].kind==='walk'&&T[T.length-1].deck===s.deck){T[T.length-1].pts.push(...s.pts.slice(1));T[T.length-1].toFr=s.toFr;T[T.length-1].toDy=s.toDy;T[T.length-1].door=s.door;continue}T.push(s)}
  T.push({kind:'arrive',deck:N[P[P.length-1].n].d,pts:[P[P.length-1].n],dest});return T}
// Phrase a step given current facing (0..3 or null). returns {say, short, arrow, newFacing}
function phrase(st,facing,G){const f=n=>Math.round(n);const lm=st.lm||{};
  const list=a=>a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];

function normEs(s){s=norm(String(s||'').replace(/[.,;:!?¿¡"“”]/g,' ')).replace(/\b(numero|num|nro)\b/g,'numero');return s.split(' ').map(w=>NUMW[w]!=null?String(NUMW[w]):w).join(' ').replace(/(\d) (\d)/g,'$1$2')}

function understand(phrase){const t=normEs(phrase);if(!t)return null;
  for(const[rx,kind,f,lab]of ESR){const m=t.match(rx);if(!m)continue;const d=(m.slice(1).find(x=>x)||'');const q=f(d);
    if(kind==='eq'){const e=EQ.find(x=>x.tag===q);if(e&&eqNid(e)!=null){const n=G.nodes[eqNid(e)];return{nid:eqNid(e),n:`${e.tag} (${e.room||ENG.DECKNAME[n.d]})`,d:n.d,lab:lab.replace('$',d)}}continue}
    let L=matches(q).filter(r=>!r.approx);const nq=norm(q);const ex=L.filter(r=>norm(r.n).includes(nq));if(ex.length)L=ex;if(/GENERATOR|ENGINE ROOM|AUXILIARY/.test(q)){const tt=L.filter(r=>r.d==='toptanks');if(tt.length)L=tt}

  if(m)return{o:m[1],d:m[2]};m=t.match(/(?:quiero ir|necesito ir|tengo que ir|voy|llevame|ir)\s+(?:a la |al |a |hasta )?(.+)$/);if(m)return{o:null,d:m[1]};

  ESR.forEach(([rx])=>{const g=new RegExp(rx.source,'g');let m;while((m=g.exec(t))){const s=m.index,e=s+m[0].length;if(used.some(([a,b])=>s<b&&e>a))continue;used.push([s,e]);const r=understand(m[0]);if(r)hits.push({s,r,ctx:t.slice(Math.max(0,s-14),s)})}});
  return hits.sort((a,b)=>a.s-b.s)}

    if(S.from&&S.to){sheet.insertAdjacentHTML('afterbegin',`<div class="say" style="border-color:#1e8e3e">Desde <b>${clean(S.from.n)}</b><br>hasta <b>${clean(S.to.n)}</b></div><button class="btn go bigb" id="go2">▶ Empezar navegación</button>`);document.getElementById('go2').onclick=()=>startNav();sheet.scrollTop=0}else sheet.insertAdjacentHTML('afterbegin',`<div class="warn">Ahora marca ${PICK==='from'?'dónde estás («Estoy en»)':'adónde vas («Voy a»)'}.</div>`)});
  sheet.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{const r=RECENT[+b.dataset.rc];S.from=r.f;S.to=r.t;startNav()})}
let SRrun=null;
function voiceQuick(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return voiceUI();
  S.phase='plan';sheet.innerHTML=`<h2 style="text-align:center">Habla ahora</h2><button class="mic on" id="micb" aria-label="Escuchando">🎤</button>
  <p class="hint" style="text-align:center">Di, por ejemplo: <i>«Estoy en la cocina y quiero ir al cuadro principal uno»</i></p><p id="heard" class="say" style="display:none"></p>
  <div class="row"><button class="btn" id="vtype" style="flex:1">⌨️ Escribir</button><button class="btn" id="vcancel" style="flex:1">Cancelar</button></div>`;
  document.getElementById('vcancel').onclick=()=>{try{SRrun&&SRrun.abort()}catch(e){}planUI()};
  document.getElementById('vtype').onclick=()=>{try{SRrun&&SRrun.abort()}catch(e){}voiceUI()};
  let got=false;
  try{const r=new SR();SRrun=r;r.lang='es-ES';r.interimResults=true;r.maxAlternatives=1;
    r.onresult=e=>{const txt=Array.from(e.results).map(x=>x[0].transcript).join(' ');const h=document.getElementById('heard');if(h){h.style.display='block';h.textContent='«'+txt+'»'}
      if(e.results[e.results.length-1].isFinal){got=true;confirmVoice(txt)}};
    r.onerror=ev=>{if(got)return;const h=document.getElementById('heard');if(h){h.style.display='block';h.innerHTML='No he podido escuchar'+(ev.error==='network'?' (necesita internet)':'')+'. Pulsa <b>⌨️ Escribir</b> y usa el micrófono del teclado.'}const m=document.getElementById('micb');if(m)m.classList.remove('on')};
    r.onend=()=>{const m=document.getElementById('micb');if(m)m.classList.remove('on');if(!got){const h=document.getElementById('heard');if(h&&h.style.display!=='block'){h.style.display='block';h.innerHTML='No te he oído. Toca el micrófono rojo para repetir.'}}};
    document.getElementById('micb').onclick=()=>{try{r.abort()}catch(e){}voiceQuick()};
    r.start()}catch(e){voiceUI()}}
function confirmVoice(txt){const od=parseOD(txt);const o=od.o,d=od.d;
  if(!d&&!o){sheet.innerHTML=`<div class="say">«${txt}»</div><div class="warn">No te he entendido.</div><div class="row"><button class="btn go bigb" id="vagain">🎤 Repetir</button></div><div class="row"><button class="btn" id="vtype" style="flex:1">⌨️ Escribir</button><button class="btn" id="vcancel" style="flex:1">Cancelar</button></div>`;
    speak('No te he entendido. Repite, por favor.');document.getElementById('vagain').onclick=voiceQuick;document.getElementById('vtype').onclick=voiceUI;document.getElementById('vcancel').onclick=planUI;return}
  if(o)S.from={nid:o.nid,n:o.n,d:o.d};if(d)S.to={nid:d.nid,n:d.n,d:d.d};
  const ready=S.from&&S.to;
  sheet.innerHTML=`<p class="small">Has dicho: «${txt}»</p><div class="say" style="font-size:1.1rem">Desde: <b>${S.from?clean(S.from.n):'—'}</b><br>Hasta: <b>${S.to?clean(S.to.n):'—'}</b></div>
  ${ready?'<button class="btn go bigb" id="vyes">✓ Sí, vamos</button>':'<div class="warn">Falta '+(S.from?'el destino':'dónde estás')+'. Márcalo con los botones o vuelve a hablar.</div>'}
  <div class="row"><button class="btn" id="vagain" style="flex:1">🎤 Repetir</button><button class="btn" id="vplan" style="flex:1">Ajustar a mano</button></div>`;
  speak(ready?`Desde ${clean(S.from.n)} hasta ${clean(S.to.n)}. ¿Vamos?`:'Me falta un dato.');
  const y=document.getElementById('vyes');if(y)y.onclick=()=>startNav();
  document.getElementById('vagain').onclick=voiceQuick;document.getElementById('vplan').onclick=()=>{planUI();drawRoute()}}
function voiceUI(){S.phase='plan';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  sheet.innerHTML=`<h2>🎤 Dímelo en español</h2><p class="hint" style="margin-top:0">Toca la casilla, pulsa el <b>micrófono del teclado</b> y di, por ejemplo: <i>«Estoy en la cocina y quiero ir al cuadro principal uno»</i>.</p>
  <div class="field"><textarea id="vtx" rows="3" style="width:100%;font-size:1rem" placeholder="Estoy en… y quiero ir a…"></textarea></div>
  <div class="row"><button class="btn go" id="vgo">Entender</button>${SR?'<button class="btn" id="vlisten">🎙 Escuchar</button>':''}<button class="btn" id="vback">Volver</button></div><div id="vres"></div>`;
  document.getElementById('vback').onclick=()=>planUI();
  const run=()=>{const txt=document.getElementById('vtx').value;const od=parseOD(txt);od.o=od.o||null;const o=od.o,d=od.d;const out=document.getElementById('vres');
    if(!o&&!d){out.innerHTML='<div class="warn">No te he entendido. Prueba con «Estoy en … y quiero ir a …».</div>';speak('No te he entendido.');return}
    const line=(lab,r)=>r?`<b>${clean(r.n)}</b> <span class="small">(${r.lab})</span>`:'<i>no indicado: márcalo tú</i>';
    out.innerHTML=`<div class="say">Desde: ${od.o?line('',o):(S.from?'<b>'+clean(S.from.n)+'</b> <span class="small">(posición actual)</span>':'<i>no indicado</i>')}<br>Hasta: ${line('',d)}</div><div class="row"><button class="btn go" id="vyes">Sí, es correcto</button><button class="btn" id="vno">Corregir</button></div>`;
    speak(`Entendido. ${o?'Desde '+clean(o.n)+'.':''} ${d?'Hasta '+clean(d.n)+'.':''} ¿Es correcto?`);
    document.getElementById('vno').onclick=()=>{out.innerHTML='';document.getElementById('vtx').focus()};
    document.getElementById('vyes').onclick=()=>{if(o)S.from={nid:o.nid,n:o.n,d:o.d};if(d)S.to={nid:d.nid,n:d.n,d:d.d};if(S.from&&S.to)startNav();else{planUI();drawRoute()}}};
  document.getElementById('vgo').onclick=run;
  if(SR)document.getElementById('vlisten').onclick=()=>{try{const r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{document.getElementById('vtx').value=e.results[0][0].transcript;run()};r.onerror=()=>{document.getElementById('vres').innerHTML='<div class="warn">El reconocimiento de voz no está disponible ahora (puede necesitar internet). Usa el micrófono del teclado.</div>'};r.start()}catch(e){}}}

function orientUI(first){navMode(true);const d=G.nodes[S.steps[S.i].pts[0]].d;if(cur.key!==d)show(d,true);focusMe(true);drawRoute();const tp=document.getElementById('navtop');tp.className='';tp.style.setProperty('--dc',DK[d].color);tp.innerHTML=`<div class=nt-to>Vas a: <b>${S.to.n}</b></div><div class="nt-row"><div class="nt-txt"><div class="nt-big">${first?'Oriéntate':'¿Hacia dónde miras?'}</div><div class="nt-sub">${first?'Ponte de cara a la proa':'Al llegar a la nueva cubierta'}</div></div></div><div class="nt-foot"><span class="nt-deck">${DK[d].name}</span></div>`;
  sheet.innerHTML=`<h2 class="onlyplan">${first?'Orientación inicial':'¿Hacia dónde miras ahora?'}</h2>
  <p class="hint">${first?'Ponte de pie de cara a la <b>proa</b> del buque y pulsa «Miro a proa».':'Mira a tu alrededor y dime hacia dónde está mirando tu cara.'} Con la cara a proa, <b style="color:var(--port)">babor</b> queda a tu izquierda y <b style="color:var(--stbd)">estribor</b> a tu derecha. En el plano, la proa está arriba.</p>
  <div class="compass"><button class="btn go" data-f="0">Miro a proa</button><button class="btn" data-f="2">Miro a popa</button><button class="btn" data-f="3" style="color:var(--port)">Miro a babor</button><button class="btn" data-f="1" style="color:var(--stbd)">Miro a estribor</button></div>
  ${first?`<div class="toggles"><label><input type="checkbox" id="tv" ${S.voice?'checked':''}> Voz</label><label><input type="checkbox" id="ts" ${S.stepsOn?'checked':''}> Contar pasos</label></div>
  <div class="warn">Ruta orientativa trazada sobre el plano de Compartimentos y Accesos Rev. D. Respeta puertas estancas cerradas, zonas restringidas y permisos; si algo no coincide, anótalo con «Corregir».</div>`:''}`;
  sheet.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{if(HF&&!S.stepsOn){await enableSteps(true)}await enableGyro();gyroAnchor(+b.dataset.f);S.facing=+b.dataset.f;S.needOrient=false;S.phase='nav';navUI(true)});
  const tv=document.getElementById('tv');if(tv)tv.onchange=()=>{S.voice=tv.checked;try{localStorage.setItem('avt-nav',JSON.stringify({voice:S.voice}))}catch(e){}};
  const ts=document.getElementById('ts');if(ts)ts.onchange=async()=>{const ok=await enableSteps(ts.checked);if(ts.checked&&!ok){ts.checked=false;sheet.insertAdjacentHTML('beforeend','<div class="warn">El contador de pasos no está disponible aquí (el iPhone no da acceso al sensor en esta página). Avanza con «Hecho» en cada punto.</div>')}};
  if(!first)speak('Al llegar, dime hacia dónde miras.')}
const ARW={recto:0,derecha:90,izquierda:-90,'atrás':180};
function arrowSVG(a){if(a==='sube'||a==='baja')return`<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="4" y="4" width="72" height="72" rx="8" fill="var(--route)"/>${[0,1,2].map(i=>`<rect x="${20+i*12}" y="${a==='sube'?52-i*14:24+i*14}" width="28" height="6" fill="#fff"/>`).join('')}<path d="${a==='sube'?'M60 14 L60 34 M52 22 L60 14 L68 22':'M60 34 L60 14 M52 26 L60 34 L68 26'}" stroke="#fff" stroke-width="5" fill="none"/></svg>`;
  if(a==='fin')return`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="var(--hi)"/><path d="M24 41 L36 53 L58 28" stroke="#14284b" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`;
  const rot=typeof a==='number'?[0,90,180,-90][a]:ARW[a];
  return`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="38" fill="var(--route)"/><g transform="rotate(${rot} 40 40)"><path d="M40 12 L62 40 L48 40 L48 66 L32 66 L32 40 L18 40 Z" fill="#fff"/></g></svg>`}
function notesHTML(){if(!notes.length)return'';return`<details><summary>Correcciones anotadas (${notes.length})</summary><p class="hint">Cópialas y pégamelas en el chat para corregir el trazado.</p><textarea id="nt" readonly>${notes.map(n=>`[${n.t}] ${n.de} → ${n.a}\nPaso: ${n.paso}\nNota: ${n.nota}`).join('\n\n')}</textarea><div class="row"><button class="btn" id="ncp">Copiar</button><button class="btn" id="ncl">Borrar</button></div></details>`}
function bindNotes(){const c=document.getElementById('ncp');if(c)c.onclick=()=>{const t=document.getElementById('nt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}c.textContent='Copiado'};
  const l=document.getElementById('ncl');if(l)l.onclick=()=>{if(confirm('¿Borrar todas las correcciones?')){notes=[];saveNotes();planUI()}}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
show('main');planUI();
}
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
async function getData(fresh){if(!fresh&&window.caches){try{const c=await caches.match('./data.enc',{ignoreSearch:true});if(c)return new Uint8Array(await c.arrayBuffer())}catch(e){}}
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),fresh?30000:20000);try{const r=await fetch('data.enc?v='+Date.now(),{cache:'no-store',signal:ctl.signal});return new Uint8Array(await r.arrayBuffer())}finally{clearTimeout(to)}}
async function purgeOld(){try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}}
async function unlock(pw,remember,again){const buf=await getData(!!again);
  const salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);const o=JSON.parse(new TextDecoder().decode(pt));
  if(!o.META||!o.DOORS){if(!navigator.onLine)throw new Error('Hace falta internet una vez para actualizar los planos.');if(!again){document.getElementById('lockmsg').textContent='Actualizando los planos a la versión nueva…';await purgeOld();return unlock(pw,remember,true)}
    if(!sessionStorage.getItem('avt-rl')){sessionStorage.setItem('avt-rl','1');location.reload();return}
    throw new Error('El móvil sigue usando los planos antiguos. Ábrela con internet y vuelve a intentarlo.')}
  if(remember)LS('avt-pw',pw);document.getElementById('lock').remove();document.querySelector('main').style.display='';document.getElementById('sheet').style.display='';try{boot(o)}catch(err){__showErr((err&&err.stack)||String(err))}}
(function(){const f=document.getElementById('lockf'),m=document.getElementById('lockmsg');
  if(!window.crypto||!crypto.subtle){m.textContent='Abre la app desde su dirección https o desde el icono de la pantalla de inicio.';return}
  f.onsubmit=async e=>{e.preventDefault();m.textContent='Abriendo planos…';try{await unlock(document.getElementById('pw').value.trim(),document.getElementById('rem').checked)}catch(err){m.textContent=(err&&err.name==='OperationError')?'Contraseña incorrecta.':'No se pudo abrir: '+((err&&err.message)||err)}};
  const s=LS('avt-pw');if(s)unlock(s,false).catch(()=>{LS('avt-pw',null);m.textContent='Introduce la contraseña.'})})();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
